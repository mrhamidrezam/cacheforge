[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycacheforge"
version = "0.1.0"
description = "Lightweight, zero-dependency caching, tiered storage, and cache stampede protection toolkit for Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Hamidreza", email = "h4midrezam@gmail.com"}
]
keywords = [
    "caching",
    "cache",
    "lru",
    "lfu",
    "ttl",
    "fifo",
    "disk-cache",
    "tiered-cache",
    "singleflight",
    "cache-stampede",
    "memoize",
    "decorator",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Database",
]

[project.scripts]
cacheforge = "cacheforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
